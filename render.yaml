services:
  - type: web
    name: pulsegear
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pulsegear-db
          property: connectionString
      - key: STRIPE_PUBLIC_KEY
        value: pk_test_sample
      - key: STRIPE_SECRET_KEY
        value: sk_test_sample
      - key: STRIPE_WEBHOOK_SECRET
        value: whsec_sample

databases:
  - name: pulsegear-db
    plan: free
    region: oregon
